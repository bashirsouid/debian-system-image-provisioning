# Host instance descriptor — cloudbox (Oracle Cloud Ampere A1, arm64).
# Copy to hosts.local/cloudbox.conf and edit. See docs/host-descriptors.md.

profiles        = server ssh-server tailscale oci-cloud data-disk cloudflare-tunnel healthchecksio k3s symlink-k3s k3s-proxy k3s-hello-world symlink-caddy symlink-docker
hostname        = cloudbox
image_id_suffix = cloudbx
architecture    = arm64
kernel_cmdline  = quiet console=ttyAMA0,115200 console=tty1 systemd.unit=multi-user.target
secure_boot     = no
disk_encryption = no
dotfiles        = skip

# k3s-proxy TLS front (optional; uncomment and set your domain to enable
# automatic HTTPS via Let's Encrypt / ZeroSSL):
# k3s_proxy_domain = hello.example.com
# acme_email       = you@example.com
