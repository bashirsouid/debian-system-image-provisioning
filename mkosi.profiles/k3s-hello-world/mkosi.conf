[Content]
# k3s-hello-world = sample static site served by k3s, exposed via
# host Caddy (k3s-proxy). This profile ships ONLY the auto-deploy
# manifest (ConfigMap + Deployment + NodePort Service). No packages are
# added here because the workload runs as a container image pulled at
# runtime (nginx:stable-alpine, multi-arch amd64+arm64).
#
# IMPORTANT: do NOT add an empty "Packages=" line here. In mkosi an
# empty list assignment RESETS the accumulated package list, wiping the
# base + every other profile's packages (symptom: tiny image, "no kernel
# was found").