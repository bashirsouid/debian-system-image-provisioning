# /var/lib/rancher/k3s/server/manifests/seaweedfs.yaml
#
# SeaweedFS single-node S3-compatible object store (single-process mode).
# Auto-deployed by k3s on startup. Contains:
#   - Deployment: chrislusf/seaweedfs:4.44 (multi-arch amd64+arm64)
#   - Service:    NodePort 30090 -> container 8333 (S3 API)
#   - Service:    NodePort 30091 -> container 9333 (Master status UI)
#   - Secret:     seaweedfs-s3-config (s3.json with S3 identity credentials)
#                 rendered at first boot from /etc/credstore/seaweedfs-s3-credentials.json
#                 by ab-k3s-seaweedfs-creds.service (Before=k3s.service)
#
# Data persists on /mnt/data/seaweedfs (hostPath, DATA partition via symlink-k3s +
# data-disk). Reachable on Tailscale via <tailscale-ip>:30090 (S3) and :30091 (UI).
#
# No Ingress: Caddy fronting (s3.<domain>, console.<domain>) is a follow-up.

---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  labels:
    app: seaweedfs
spec:
  type: NodePort
  selector:
    app: seaweedfs
  ports:
  - port: 8333
    targetPort: 8333
    nodePort: 30090
    protocol: TCP
    name: s3-api
  - port: 9333
    targetPort: 9333
    nodePort: 30091
    protocol: TCP
    name: master-ui

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels:
    app: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:4.44
        args:
        - "server"
        - "-dir=/data"
        - "-s3"
        - "-s3.port=8333"
        - "-s3.config=/etc/seaweedfs/s3.json"
        - "-master.volumeSizeLimitMB=1024"
        - "-master.defaultReplicaPlacement=000"
        - "-volume.max=0"
        - "-fileSizeLimitMB=256"
        - "-filer"
        ports:
        - containerPort: 8333
          name: s3-api
        - containerPort: 9333
          name: master-ui
        - containerPort: 8888
          name: filer
        - containerPort: 8080
          name: volume
        volumeMounts:
        - name: data
          mountPath: /data
        - name: s3-config
          mountPath: /etc/seaweedfs
          readOnly: true
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
      volumes:
      - name: data
        hostPath:
          path: /mnt/data/seaweedfs
          type: DirectoryOrCreate
      - name: s3-config
        secret:
          secretName: seaweedfs-s3-config
          defaultMode: 0400
