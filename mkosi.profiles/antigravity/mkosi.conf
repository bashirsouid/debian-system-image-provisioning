[Content]
# Google Antigravity suite (CLI + IDE + Hub). No stable apt/Flatpak
# distribution exists for 2.x; the first-boot oneshot
# (antigravity-init.service) downloads and installs all three
# components from antigravity.google, after which each product's
# built-in auto-updater keeps it current without rebuilds.
#
# Components installed:
#   - CLI (agy)  -> ~/.local/bin/agy     (per-user, self-updates)
#   - IDE        -> /opt/antigravity-ide/ (system-wide, user-updater)
#   - Hub (2.0)  -> /opt/antigravity/     (system-wide, user-updater)
Packages=
    curl

