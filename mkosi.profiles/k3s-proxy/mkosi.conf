[Content]
# k3s-proxy = host-level Caddy reverse proxy that terminates public
# TLS for services published by the local k3s cluster (see the
# k3s-hello-world profile for the sample site it fronts).
#
# caddy comes from Debian trixie MAIN with native amd64 AND arm64
# packages, so no third-party apt repo / apt-keys.conf entry is needed
# and nothing here is architecture-pinned (cloudbox is arm64; other
# hosts may be amd64 -- apt resolves the right one per build).
#
# What else this profile drops in:
#   etc/caddy/Caddyfile                  placeholder site block; a host
#                                        descriptor with k3s_proxy_domain
#                                        replaces it via host-descriptor.sh
#   etc/nftables.conf.d/61-k3s-proxy.nft open tcp/80, tcp+udp/443 inbound
#   etc/default/ab-k3s-extra             INSTALL_K3S_EXEC disabling k3s'
#                                        bundled Traefik + ServiceLB, which
#                                        would otherwise fight Caddy for
#                                        80/443 on the host
Packages=
    caddy
